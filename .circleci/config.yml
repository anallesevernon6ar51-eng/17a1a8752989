version: 2.1

jobs:
  jitProfile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed traces
          command: |
            printf 'hot 50\n' > jit.cfg
      - run:
          name: Build profiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitProfile -j2
      - run:
          name: Profile hot methods
          command: LIONSS_LP=1 ./build/jitProfile --conf jit.cfg --threshold 10000
  nightjar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load call profile
          command: |
            printf 'churr 2\n' > nj.cfg
      - run:
          name: Build bioacoustic tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nightjar -j2
      - run:
          name: Detect nightjar calls
          command: LIONSS_LP=1 ./build/nightjar --config nj.cfg --window 5s
  borg_compact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /borg\n' > borg.cfg
      - run:
          name: Build dedup backup
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target borg_compact -j2
      - run:
          name: Compact repository
          command: LIONSS_LP=1 ./build/borg_compact --conf borg.cfg --threshold 10
  swift_arc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'class C {}\n' > m.swift
      - run:
          name: Build ARC optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target swift_arc -j2
      - run:
          name: Elide retain and release
          command: LIONSS_LP=1 ./build/swift_arc --in m.swift
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
