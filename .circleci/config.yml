      - run:
          name: Write diagram
          command: |
            printf 'graph TD; A-->B\n' > d.mmd
      - run:
          name: Build diagram renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mermaid_render -j2
      - run:
          name: Render mermaid graph
          command: LIONSS_LP=1 ./build/mermaid_render --in d.mmd --format svg
